[project]
name = "futures-lab"
version = "0.1.0"
description = "API-first crypto futures research, paper trading, and live-ready strategy lab"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "websockets>=12,<16",
  "numpy>=1.26,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
research = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.4,<5",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pandas>=2.2,<3",
  "plotly>=6.1,<7",
  "polars>=1.30,<2",
  "pyarrow>=18,<24",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
]
nautilus = [
  "nautilus_trader>=1.220,<2",
]

[project.scripts]
futures-lab = "futures_lab.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
futures_lab = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
