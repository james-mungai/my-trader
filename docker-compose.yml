services:
  api:
    build: .
    image: futures-lab:local
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_DIR: /app/data
    ports:
      - "${FUTURES_LAB_PORT:-8090}:8090"
    volumes:
      - futures_lab_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  futures_lab_data:
